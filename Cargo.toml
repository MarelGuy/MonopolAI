[package]
name = "MonopolAI"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json", "tokio"] }
clap = { version = "4.6.7", default-features = false, features = [
    "color",
    "derive",
    "env",
    "help",
    "std",
    "suggestions",
    "usage",
] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "ansi",
    "std",
    "env-filter",
] }
tower-http = { version = "0.7.1", default-features = false, features = [
    "cors",
] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
    "std",
] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
    "uuid",
] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
